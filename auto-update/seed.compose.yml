# The auto-update wrapper carrying this checkout as the version after the one
# on npm, to exercise the coming release's update cycle end to end (see
# seed.Dockerfile). From the repository root:
#
#   docker compose -f auto-update/seed.compose.yml up --build
#
# With 1.1.49 on npm: 1.1.49 is installed first, from the registry, and runs
# into the job loop, where it learns of 1.1.50 and updates to this checkout's
# code. INITIAL_VERSION installs another version first, and VERSIONS
# (comma-separated) packs another set: VERSIONS=1.1.49,1.1.50 runs this code
# on both sides.

services:
  nosana_node_seed:
    build:
      context: ..
      dockerfile: auto-update/seed.Dockerfile
      args:
        VERSIONS: ${VERSIONS:-}
    container_name: nosana-node-seed
    image: nosana_node_seed:latest
    command: start --network devnet --docker /etc/run/docker.sock
    environment:
      NOSANA_NODE_INITIAL_VERSION: ${INITIAL_VERSION:-}
      # How the FRP proxy container reaches this one on the network; the
      # default is the dev container's name.
      FRP_NODE_INTERNAL_HOSTNAME: nosana-node-seed
    networks:
      - NOSANA_GATEWAY
    volumes:
      - ~/.nosana/:/root/.nosana/
      - /var/run/docker.sock:/etc/run/docker.sock

networks:
  NOSANA_GATEWAY:
    name: NOSANA_GATEWAY
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.101.0/24
          gateway: 192.168.101.1
